distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# Gradle distribution (deterministic version)
distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.0-bin.zip

# Security: verify distribution integrity (replace with actual SHA256 from gradle.org)
distributionSha256Sum=<PUT_REAL_SHA256_HERE>

# Network stability (useful for CI and slow connections)
networkTimeout=30000

# Validate distribution URL before download
validateDistributionUrl=true

zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
